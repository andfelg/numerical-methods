<style>
    label{
        opacity: 70%;
    }
</style>

<header class="p-5 flex justify-center">
    <div class="lg:w-full w-80">
        <app-back-button></app-back-button>
    </div>
</header>
<section class="page-content mt-3">
    <div class="flex flex-col lg:flex-row justify-center items-center lg:justify-between">
        <!--LEFT PANEL-->
        <div class="p-5 w-80 h-130 border border-gray-500">
            <div class="flex flex-col">
                <label for="func">Funcion <span class="text-orange-500">*</span></label>
                <input 
                    type="text" 
                    name="func" 
                    [(ngModel)]="formValues.func"
                    placeholder="x**3 - 2x + 5" 
                    class="mt-2 border-gray-500 border px-2 rounded-md">
            </div>

            <div class="mt-12">
                <p class="font-semibold underline">Parametros</p>

                <div class="flex flex-col mt-5">
                    <label>Intervalo [a,b] <span class="text-orange-500">*</span></label>
                    <div class="flex justify-between gap-2 mt-2">
                        <label>a =</label>
                        <input 
                            type="number" 
                            [(ngModel)]="formValues.interA"
                            placeholder="0" 
                            class="w-25 border-gray-500 border px-2 rounded-md">
                        <label>b =</label>
                        <input 
                            type="number" 
                            [(ngModel)]="formValues.interB"
                            placeholder="0" 
                            class="w-25 border-gray-500 border px-2 rounded-md">
                    </div>
                </div>

                <div class="mt-7 flex justify-between">
                    <label>Max IT <span class="text-orange-500">*</span></label>
                    <input 
                        type="number" 
                        [(ngModel)]="formValues.maxIterations"
                        placeholder="100" 
                        class="w-40 border-gray-500 border px-2 rounded-md">
                </div>

                <div class="mt-2 flex justify-between">
                    <label>Tolerancia (e) <span class="text-orange-500">*</span></label>
                    <input 
                        type="number" 
                        [(ngModel)]="formValues.tolerance"
                        placeholder="0.000001" 
                        step="0.000001"
                        class="w-40 border-gray-500 border px-2 rounded-md">
                </div>
            </div>
            
            <div class="mt-20">
                <button 
                    (click)="iniciarMetodo()" 
                    class="bg-cyan-600 text-white p-2 w-full rounded-lg hover:cursor-pointer hover:opacity-80">
                    Iniciar Metodo
                </button>
                <button 
                    (click)="limpiarFormulario()" 
                    class="mt-3 border border-gray-500 p-2 w-full rounded-lg hover:cursor-pointer hover:bg-gray-500/10">
                    Limpiar
                </button>
            </div>
        </div>

        <!--RIGHT PANEL-->
        <div class="p-5 md:w-175 w-80 h-130 overflow-x-scroll border border-gray-500 mt-10 lg:mt-0">
            <!--TOP PROGRESS BUTTONS-->
            <section class="flex gap-2">
                <button class="w-10 h-10 bg-black flex justify-center items-center rounded-full hover:cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-back-up">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M9 14l-4 -4l4 -4" />
                        <path d="M5 10h11a4 4 0 1 1 0 8h-1" />
                    </svg>
                </button>
                <button class="w-10 h-10 bg-black flex justify-center items-center rounded-full hover:cursor-pointer">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-forward-up">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M15 14l4 -4l-4 -4" />
                        <path d="M19 10h-11a4 4 0 1 0 0 8h1" />
                    </svg>
                </button>
            </section>

            <section class="flex justify-center h-full">
                @if(isWaiting){
                    <div class="pt-25 flex items-center flex-col opacity-50">
                        <p>Waiting for data...</p>
                        <div class="mt-10">
                            <app-loadindicator></app-loadindicator>
                            
                        </div>
                    </div>
                }
            </section>
        </div>
    </div>
</section>
