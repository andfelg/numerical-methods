<main class="flex justify-center">
    <div class="lg:mt-30 mt-10 p-5 flex flex-col justify-center w-340">
        <header class="flex flex-col lg:flex-row justify-center lg:justify-between w-full items-center">
            <div>
                <h1 class="text-[4vh] lg:text-[7vh]">Numerical Methods</h1>
                <a href="https://github.com/andfelg/numerical-methods.git" target="_blank" class="opacity-60 flex -mt-1 w-fit hover:underline">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-brand-github">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M9 19c-4.3 1.4 -4.3 -2.5 -6 -3m12 5v-3.5c0 -1 .1 -1.4 -.5 -2c2.8 -.3 5.5 -1.4 5.5 -6a4.6 4.6 0 0 0 -1.3 -3.2a4.2 4.2 0 0 0 -.1 -3.2s-1.1 -.3 -3.5 1.3a12.3 12.3 0 0 0 -6.2 0c-2.4 -1.6 -3.5 -1.3 -3.5 -1.3a4.2 4.2 0 0 0 -.1 3.2a4.6 4.6 0 0 0 -1.3 3.2c0 4.6 2.7 5.7 5.5 6c-.6 .6 -.6 1.2 -.5 2v3.5" />
                    </svg>
                    Github
                </a>
            </div>
            <nav class="lg:mt-0 mt-5 flex gap-10">
                @for(route of routes; track $index){
                    <a 
                        routerLink="{{route.url}}"
                        routerLinkActive="active-link"
                        [routerLinkActiveOptions]="{ exact: true }"
                        class="relative text-lg hover:opacity-70 pb-1"
                    >
                        {{route.name}}
                    </a>
                }
            </nav>
        </header>
        <div class="mt-14 p-10">
            <router-outlet />
        </div>
    </div>
</main>
